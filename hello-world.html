<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-background flex items-center justify-center" style="background-color: #09090b;">

    <div class="text-center space-y-6 p-10 rounded-2xl border border-zinc-800 bg-zinc-900 shadow-2xl max-w-md w-full mx-4">

        <div class="inline-flex items-center rounded-full border border-zinc-700 bg-zinc-800 px-3 py-1 text-xs font-medium text-zinc-400 tracking-wide uppercase">
            Welcome
        </div>

        <h1 class="text-5xl font-bold tracking-tight text-white">
            Hello, World!
        </h1>

        <p class="text-zinc-400 text-base leading-relaxed">
            A simple greeting, beautifully styled with the shadcn design system.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
            <button class="inline-flex items-center justify-center rounded-md bg-white px-5 py-2.5 text-sm font-medium text-zinc-900 shadow hover:bg-zinc-100 transition-colors">
                Get Started
            </button>
            <a href="login.html" class="inline-flex items-center justify-center rounded-md border border-zinc-700 bg-transparent px-5 py-2.5 text-sm font-medium text-zinc-300 hover:bg-zinc-800 hover:text-white transition-colors">
                Login
            </a>
        </div>

    </div>

</body>
</html>
